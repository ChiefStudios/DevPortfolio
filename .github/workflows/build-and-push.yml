name: Build and Push

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/chiefstudios/dev-portfolio

jobs:
  build-and-push:
    # Manual runs from other branches should not push images
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> ghcr.io/chiefstudios/dev-portfolio:main (moving tag)
      # main -> ghcr.io/chiefstudios/dev-portfolio:main-<short-sha> (rollback target)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=${{ github.ref_name }}-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploys through tower (GitHub OIDC, no Coolify secret). tower maps this repo and branch to its Coolify app,
      # waits for the deploy and fails the job unless it succeeds.
      - name: Deploy via tower
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        uses: ChiefStudios/tower-action@v1
        with:
          url: https://tower.chiefstudios.de
