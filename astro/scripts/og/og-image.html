<!doctype html>
<!-- Source of public/og-image.png (1200x630). Edit the text, then run: node scripts/og/render.mjs -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 80px;
    display: flex; flex-direction: column; justify-content: center; gap: 22px;
    font-family: 'Bai Jamjuree', sans-serif; color: #effafc;
    background:
      radial-gradient(circle at 12% 30%, rgba(92, 200, 232, 0.22), transparent 42%),
      radial-gradient(circle at 88% 85%, rgba(110, 123, 242, 0.22), transparent 45%),
      radial-gradient(circle at 60% 0%, rgba(6, 22, 79, 0.9), transparent 55%),
      #0d0c1a;
  }
  .eyebrow { font: 600 26px/1 'JetBrains Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; color: #5cc8e8; }
  h1 { margin: 0; font-weight: 600; font-size: 68px; line-height: 1.08; letter-spacing: -0.01em; max-width: 1000px; }
  .lede { font-size: 28px; color: #8b93b8; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .chips { display: flex; gap: 14px; }
  .chip { font: 500 22px/1 'JetBrains Mono', monospace; color: #5cc8e8; padding: 16px 18px; border: 1px solid #2a2847; border-radius: 10px; background: rgba(26, 25, 49, 0.7); }
  .domain { font: 500 24px/1 'JetBrains Mono', monospace; color: #8b93b8; }
</style>
</head>
<body>
  <div class="eyebrow">Chief-Daniel Osei</div>
  <h1>I build and run the infrastructure behind websites serving thousands.</h1>
  <div class="lede">Five client sites, 1,000+ weekly users. CI/CD, self-hosting and monitoring.</div>
  <div class="row">
    <div class="chips"><span class="chip">Docker</span><span class="chip">GitHub Actions</span><span class="chip">Coolify</span></div>
    <span class="domain">chiefosei.dev</span>
  </div>
</body>
</html>
